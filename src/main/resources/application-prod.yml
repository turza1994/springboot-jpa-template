spring:
  jpa:
    show-sql: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

logging:
  level:
    com.example.app: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}